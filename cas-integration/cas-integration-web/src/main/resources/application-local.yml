server:
  port: 8080

nagra:
  enabled: true
  base-url: http://localhost:9090
  source-id:
    physical: "1000"
    virtual: "2000"
  paths:
    create-bundled-account: "/adm/v1/bundled/accounts"
    create-account: "/adm/v1/accounts"
    create-entitlement: "/rmg/v1/operator/entitlements"
    create-device: "/adm/v1/devices"
    update-device: "/adm/v1/devices/{deviceId}"
    get-device: "/adm/v1/devices/{deviceId}"
    get-entitlements: "/rmg/v1/operator/entitlements"
    update-account: "/adm/v1/accounts/{accountId}"
    delete-entitlement: "/rmg/v1/operator/entitlements/{entitlementId}"
    cancel-account: "/adm/v1/accounts/{accountId}"
    get-bundled-account: "/adm/v1/bundled/accounts/{accountId}"
    purge-account: "/adm/v1/accounts/actions/purgeAccount/{accountId}"

salesforce:
  enabled: true
  token-url: "http://localhost:9090/services/oauth2/token"
  api-version: "v60.0"
  client-id: "local-test-client"
  client-secret: "local-test-secret"
  type-mapping:
    "[HD Merlin]": TIVU_HD
    "[UHD Merlin]": TIVU_4K