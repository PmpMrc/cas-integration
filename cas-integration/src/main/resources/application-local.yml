spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tivusat_cas
    username: tivusat
    password: tivusat
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

nagra:
  enabled: true
  base-url: http://localhost:9090
  source-id:
    physical: "1000"
    virtual: "2000"
  paths:
    create-account: "/adm/v1/accounts"
    create-entitlement: "/rmg/v1/entitlements"
    create-device: "/adm/v1/devices"
    update-device: "/v1/devices/{deviceId}"
    get-device: "/adm/v1/devices/{deviceId}"
    get-entitlements: "/rmg/v1/operator/entitlements"