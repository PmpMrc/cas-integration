spring:
  datasource:
    url: jdbc:h2:mem:tivusat_cas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

nagra:
  base-url: http://localhost:9090
  source-id:
    physical: "1000"
    virtual: "2000"
  paths:
    create-account: "/adm/v1/accounts"
    create-entitlement: "/rmg/v1/entitlements"
    create-device: "/adm/v1/devices"
    update-device: "/v1/devices/{deviceId}"
    get-device: "/adm/v1/devices/{deviceId}"
    get-entitlements: "/rmg/v1/operator/entitlements"